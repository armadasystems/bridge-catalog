name: Catalog snapshot

# Publishes models/apps as an artifact for the Pulse (StarRocks/Omni) dashboard.
# The data team pulls the newest `bridge-catalog-snapshot` artifact from a staging run.
on:
  push:
    branches: [staging]
  pull_request:
    branches: [staging]
  workflow_dispatch:

permissions:
  contents: read

# A newer merge supersedes an in-flight run, so an older snapshot never lands last.
concurrency:
  group: catalog-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # git history is needed for start dates

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Test exporter
        run: python -m pytest scripts/tests -q

      # Partner apps come from bridge-ui's partners.tracking.json (read with the shared GitHub App).
      - name: Get token for bridge-ui
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}
          owner: armadasystems
          repositories: bridge-ui

      - name: Checkout bridge-ui partner data
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: armadasystems/bridge-ui
          ref: staging
          path: bridge-ui
          token: ${{ steps.app-token.outputs.token }}
          sparse-checkout: src/features/partners
          fetch-depth: 0 # partner start dates come from history

      - name: Export snapshot
        run: python scripts/export_catalog.py --repo . --out out --partners-repo bridge-ui

      # Re-running an old run checks out an old commit; don't publish it as the newest snapshot.
      - name: Check commit is still the branch tip
        id: tip
        if: github.event_name != 'pull_request'
        run: |
          git fetch -q origin "$GITHUB_REF_NAME"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$(git rev-parse --short HEAD) is not the tip of $GITHUB_REF_NAME; skipping upload"
          fi

      - name: Upload snapshot
        if: steps.tip.outputs.current == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bridge-catalog-snapshot
          path: out/
          retention-days: 90
          if-no-files-found: error
