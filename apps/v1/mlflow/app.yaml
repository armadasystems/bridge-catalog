name: "mlflow"
displayName: "MLflow"
description: "MLflow is a platform for managing the machine learning lifecycle—tracking experiments, packaging code, and deploying or sharing models. It integrates with popular ML libraries (TensorFlow, PyTorch, XGBoost, etc.) but works with any library or tool."
category: "MLOps"
tags: ["mlflow", "mlops"]

# Air-gap: chart is pulled from the seed Harbor's OCI `helm` project, not gitlab.com.
# k8s-manager passes repoURL through verbatim (it applies no registry override to
# catalog workloads), so this must be the literal seed host. Charts are pushed as
# helm/<name>:<version>, so chartName + chartVersion below resolve unchanged.
chart:
  repoURL: "oci://harbor.internal.local/helm"
  chartName: "mlflow"

# Air-gap: served from the seed Gitea's mirror of this repo instead of S3.
logoURL: "https://gitea.internal.local/amcop/catalog/raw/branch/airgap-apps-models/icons/application_icons/ml_flow.svg"

versions:
  - chartVersion: "1.6.2"
    appVersion: "3.3.2"
    valuesFile: "values.yaml"

