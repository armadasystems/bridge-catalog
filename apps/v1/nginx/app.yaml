name: "nginx"
displayName: "NGINX Web Server"
description: "High-performance HTTP and reverse proxy server"
category: "Infrastructure"
tags: ["nginx", "web", "proxy"]

# Air-gap: chart is pulled from the seed Harbor's OCI `helm` project, not gitlab.com.
# k8s-manager passes repoURL through verbatim (it applies no registry override to
# catalog workloads), so this must be the literal seed host. Charts are pushed as
# helm/<name>:<version>, so chartName + chartVersion below resolve unchanged.
chart:
  repoURL: "oci://harbor.internal.local/helm"
  chartName: "nginx"

# Air-gap: served from the seed Gitea's mirror of this repo instead of artifacthub.io.
logoURL: "https://gitea.internal.local/amcop/catalog/raw/branch/airgap-apps-models/icons/application_icons/nginx.png"

versions:
  - chartVersion: "15.6.2"
    appVersion: "1.25.3"
    schemaFile: "schema.json"
    valuesFile: "values.yaml"
  - chartVersion: "17.0.0"
    appVersion: "1.26.0"
    schemaFile: "schema.json"
    valuesFile: "values.yaml"
